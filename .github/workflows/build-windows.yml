name: build-windows

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    env:
      ARCH: x64
      PLATFORM: windows64
      MSYSTEM: CLANG64
      PKG_PREFIX: mingw-w64-clang-x86_64
      TRIPLE: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup CEF
        uses: ./.github/actions/setup-cef
        with:
          platform: ${{ github.workflow }}-x64

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            mingw-w64-clang-x86_64-cc
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-libplacebo
            mingw-w64-clang-x86_64-libass
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-shaderc
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-llvm

      # -------------------------
      # Cache mpv build/install
      # -------------------------
      - name: Cache mpv
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: |
            third_party/mpv-install
          key: mpv-windows-x64-${{ hashFiles('dev/windows/build_mpv_source.ps1') }}
          restore-keys: |
            mpv-windows-x64-

      - name: Build mpv from source
        shell: pwsh
        run: |
          dev\windows\build_mpv_source.ps1 -Arch x64 -Force

      # -------------------------
      # Rust / Cargo cache
      # -------------------------
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64
          cache-on-failure: true

      # -------------------------
      # Build Jellium
      # -------------------------
      - name: Build and package
        shell: cmd
        env:
          LIBCLANG_PATH: C:\msys64\CLANG64\bin
          MSYS_BIN: C:\msys64\CLANG64\bin
          BINDGEN_EXTRA_CLANG_ARGS: --target=x86_64-pc-windows-msvc
          MATRIX_ARCH: x64
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" %MATRIX_ARCH% || exit /b 1
          set "PATH=%PATH%;%MSYS_BIN%"
          cargo xtask package --external-mpv "%CD%\third_party\mpv-install" --prefix build/install --dist dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/JelliumDesktop-*.zip
          if-no-files-found: error
